# Interface contract between the PCB designs and the case CAD.
#
# Both sides READ this file. Neither side owns it. It carries only what
# crosses the boundary between electrical and mechanical -- nothing that
# lives wholly inside one of them.
#
# Changing anything here after gate G2 (see docs/WORKFLOW.md) means:
# bump `version`, add a `changelog` line, re-run the virtual fit, and
# re-print the affected coupon. That discipline is the whole point.

version: 7
units: mm
key_unit: 19.05

changelog:
  - "v1 - initial contract. Values marked TODO are unresolved and block G2."
  - "v2 - Cirque is TM040040 (40 mm), not TM035035. Both pods now share a
     50 mm outside ring diameter for visual symmetry. Left pod moved 2.9 mm
     outboard to hold 5 mm clearance with the larger ring. Right unchanged."
  - "v3 - corrected the pod stack. The sensor sits ABOVE the bearing on a
     static centre post; it is not encircled by it. The bore only has to
     pass the post and its cable, so stock bearings fit after all and the
     v2 claim that none did was wrong. 6806-2RS picked."
  - "v4 - display module resolved: Waveshare SKU 19192, 1.28in GC9A01.
     37.5 mm round PCB, 40.4 mm overall including the header tab, 32.4 mm
     active glass. Closes the module_od TODO. Both figures fit inside the
     50 mm ring, so the tab hides within the pod."
  - "v5 - main PCB outlines exported to hardware/outlines/ for the case.
     Left 148.97 x 120.74, right 167.21 x 120.74. Pod centres recorded in
     PCB coordinates; the pod ring overhangs the main board edge by 2.3 mm
     (left) and 1.5 mm (right), so the two boards overlap in plan view."
  - "v6 - switch-plate cutouts exported. 14.00 x 14.00 mm with 0.5 mm
     corner reliefs per marbastlib plate library; the 2.25u Shift also gets
     two 6.75 x 14.0 mm stabiliser cutouts. Replaces the LED light holes as
     the geometry the case consumes."
  - "v7 - controller pin assignment fixed: 27 of 30 GPIO used, 3 spare.
     GP0/GP1 are dual-function (SPI0 RX/CSn or I2C0 SDA/SCL), which defers
     the Cirque bus decision to firmware and knob-module wiring rather than
     baking it into the controller. See docs/CONTROLLER.md."

# ---------------------------------------------------------------------------
# Upstream truth. Derived, never hand-edited.
# ---------------------------------------------------------------------------
layout:
  source: hardware/layout/hasukey-both.kle.json
  resolved: hardware/layout/keys-resolved.json
  pods: hardware/layout/pods.json
  regenerate: "python3 hardware/layout/kle_parse.py && python3 hardware/layout/place.py"

# Per-board datum = min corner of that half's (keys + pod) bounding box, in
# the combined KLE frame. Every coordinate below is relative to its own
# board datum, so the two halves never share a coordinate system.
boards:
  main_left:
    datum_in_kle_frame: [0.0, 0.0]
    extent: [193.59, 114.64]
    key_count: 32
    pod_centre: [168.59, 80.01]
    ring_od: 50.0          # matched to the right pod
    sensor_od: 32.4        # GC9A01 active glass (was estimated 33.0)
    module_od: 37.5        # Waveshare SKU 19192 round PCB
    module_extent: 40.4    # overall, including the pin-header tab
    module_note: >
      Annulus is 6.25 mm on the round axis and 4.8 mm across the tab axis.
      Both positive, so the tab hides inside the 50 mm ring rather than
      protruding. Module has a BL pin, so backlight control is available as
      the design assumed. 3.3 V / 5 V tolerant, 4-wire SPI.
  main_right:
    datum_in_kle_frame: [135.02, 0.0]
    extent: [212.64, 114.64]
    key_count: 37
    pod_centre: [25.0, 80.01]
    ring_od: 50.0
    sensor_od: 40.0        # Cirque TM040040

outlines:
  source: hardware/outlines/            # regenerate: hardware/export_outlines.py
  formats: "DXF (perimeter, for CAD import), JSON (vertices), STEP (3D fit reference)"
  main_left:  { size: [148.97, 120.74], vertices: 23, pod_centre: [197.17, 108.58] }
  main_right: { size: [167.21, 120.74], vertices: 25, pod_centre: [2.86, 108.58] }
  pod_overhang: >
    The pod centres lie OUTSIDE their main board: the knob module is a
    separate PCB sitting inboard of each half. Its 50 mm ring overhangs the
    main board edge by 2.3 mm on the left and 1.5 mm on the right, so the two
    boards overlap in plan view. The case must resolve this in Z, or the main
    outline needs a notch. Decide at G3.
  plate:
    files: "hardware/outlines/dyad-plate-<half>.dxf / .json  (hardware/export_plate.py)"
    cutout: "14.00 x 14.00 mm, 0.5 mm corner relief"
    stabilised: "2.25u Shift only: + two 6.75 x 14.0 mm cutouts at x +-8.53..15.28, y -6.0..+8.0"
    counts: "left 34 loops (31 plain + 3 for the stabilised key), right 37"
    source: >
      Geometry taken from marbastlib's own plate library rather than hardcoded.
      Key width cannot be read from the switch footprint: marbastlib's hotswap
      series stops at 1.75u, so kbplacer falls back to 1u and the name lies.
      Width comes from the stabiliser footprint instead.
  perimeter_only: >
    Taken from the board's computed polygon outlines, not raw Edge.Cuts. The
    reverse-mount LED footprint cuts its own light hole, so Edge.Cuts carries
    ~640 extra loops per board that have nothing to do with the case. Those
    are exported separately as *-holes.json.

# ---------------------------------------------------------------------------
# Fixed by decree, not negotiated. See "push uncertainty into the part with
# the most slack" in docs/WORKFLOW.md. The controller absorbs the coupling
# because it is small, singular, and ~$15 to respin.
# ---------------------------------------------------------------------------
controller_envelope:
  extent: [50.0, 35.0]
  max_height_above_pcb: 10.0    # tallest part is the TRRS jack
  pcb_thickness: 1.6
  outline: hardware/pcb-controller/dyad-controller.kicad_pcb  # 50 x 35, 2 mm corners
  pinout: docs/CONTROLLER.md
  gpio_used: 27
  gpio_spare: 3
  mounting_holes: TODO          # positions unset; blocks G2
  note: >
    The case must guarantee this volume somewhere reachable by both FFCs.
    The controller PCB must fit inside it. Neither side may shrink or
    reshape this without a version bump and a re-fit.

# ---------------------------------------------------------------------------
# Z stack. The axis that gets forgotten until something does not close.
# ---------------------------------------------------------------------------
z_stack:
  plate_thickness: 1.5
  plate_top_to_pcb_top: 5.0     # standard MX
  pcb_thickness: 1.6
  below_pcb_clearance: 2.5      # hotswap socket ~1.8 + diode + margin
  standoff_height: TODO
  case_floor_to_plate_top: TODO
  knob_stack: TODO              # ring + bearing + sensor; set at G1 from Phase 2

# ---------------------------------------------------------------------------
# Connectors and ports. Positions are case-wall coordinates, set at G2.
# ---------------------------------------------------------------------------
connectors:
  main_ffc:  { pins: 20, pitch: 0.5, position: TODO }
  knob_ffc:  { pins: 14, pitch: 0.5, position: TODO }
  usb_c:     { position: TODO, cutout_clearance: TODO }
  trrs:      { position: TODO, cutout_clearance: TODO }
  service_loop: TODO            # slack length per cable, so assembly is possible

mounting:
  insert: M3 heat-set
  hole_diameter: TODO           # after the tolerance coupon is measured
  positions_main_left: TODO
  positions_main_right: TODO
  positions_controller: TODO

# ---------------------------------------------------------------------------
# One measured number, referenced everywhere. Never scatter magic clearances.
# ---------------------------------------------------------------------------
fit_clearance: TODO             # from the tolerance strip coupon, printer + filament specific

# ---------------------------------------------------------------------------
# Knob mechanism. All TODO until Phase 2 produces physical parts.
# ---------------------------------------------------------------------------
knob:
  mechanism: "ring gear driving off-axis EC11 (PLAN.md section 2, option A)"
  bearing: 6806-2RS             # 30 x 42 x 7, both pods
  stack: >
    The sensor sits ABOVE the mechanism, on a static centre post rising
    through the bearing bore. The bearing does not encircle the sensor, so
    the bore only has to pass the post plus its cable (~12 mm), never the
    40 mm Cirque. With a 50 mm ring and a ~2.25 mm wall, any bearing up to
    45.5 mm OD fits. Alternates: 6805-2RS (25x37x7), 6905-2RS (25x42x9).
    The 5.0 mm annulus is therefore a GRIP dimension, not a bearing one.
  post_stiffness: TODO          # cantilever deflection under thumb load. Measure;
                                # a soft post means poor tracking and a cheap feel.
  bearing_under_cirque: TODO    # steel now sits directly beneath the sensor, which
                                # is WORSE for capacitive keep-out than a coplanar
                                # ring. Bench-measure; POM bearing is the fallback.
  ring_od: 50.0                 # fixed, both pods (see boards.*.ring_od)
  ring_wall: 2.25               # sets the 45.5 mm bearing OD ceiling
  ring_height: TODO
  gear_ratio: TODO
  cirque_metal_keepout: TODO    # capacitive; measured, not assumed
